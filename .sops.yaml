# sops recipient groups.
#
# Each secrets file is encrypted only to the hosts that consume it, plus the
# administration key (`&client`, the MacBook key used for editing and for the
# flake apps that write secrets). A host that does not consume a file is not a
# recipient of it.
keys:
  - &client ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGfRvOqesirqZzMXPF7DLQCE5+jvxITEyvs8a/wcUBVz
  - &raspi ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDAl2PpRbm6XAMtI0bpEMt2NcEy1u2J+bCdr2ILjFpJs
  - &azure ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHayRnzRhTJMO3jsZlrmoKzMAT6MPZHq6ZIsAHUzBS0K
  # pascal-cloud: 该主机 SSH host ed25519 key 经 `ssh-to-age` 转换后的 age key；
  # 主机重建或换 host key 后需重新转换并 `sops updatekeys secrets/pascal-cloud.yaml`。
  - &pascal-cloud ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM1w30Ah/5xWY2vAEFAfhmGfGF+yQuZTnBRAwvUdCh7e
  # 529_2: 物理桌面；填入该主机 SSH host ed25519 key 经 `ssh-to-age` 转换后的 age key。
  - &529_2 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBozXj2QTucf1QDkl9jLKwcJOApiSYVOiW1oruWSpt81
creation_rules:
  # github_token: MacBook only.
  - path_regex: secrets/macbook\.yaml$
    key_groups:
    - age:
      - *client
  # raspi-consumed secrets (wifi, hust, singbox, tailscale/authkey_raspi).
  - path_regex: secrets/raspi\.yaml$
    key_groups:
    - age:
      - *client
      - *raspi
  # azure-consumed secrets (substore + remote-device tailscale auth keys).
  - path_regex: secrets/azure\.yaml$
    key_groups:
    - age:
      - *client
      - *azure
  # Shared by raspi and azure (my-et-network).
  - path_regex: secrets/mesh\.yaml$
    key_groups:
    - age:
      - *client
      - *raspi
      - *azure
  # 529_2-scoped file.
  - path_regex: secrets/529-2\.yaml$
    key_groups:
    - age:
      - *client
      - *529_2
  # pascal-cloud-scoped file (DDNS report uuid).
  - path_regex: secrets/pascal-cloud\.yaml$
    key_groups:
    - age:
      - *client
      - *pascal-cloud
  # OpenTofu provider credentials; administration workstation only.
  - path_regex: secrets/(cloudflare|tailscale)\.env$
    key_groups:
    - age:
      - *client
